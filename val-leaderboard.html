* { box-sizing: border-box; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 24px 60px; }
header h1 { font-size: 20px; margin: 0 0 2px; }
.basis-stamp {

}
.gen-at { color: var(--muted); font-size: 12px; }
.tabs { margin: 18px 0 12px; display: flex; gap: 8px; }
.tabs button {

  background: var(--surface); color: var(--ink-2); font: inherit;
  font-weight: 600; cursor: pointer;
}
.tabs button.on { color: var(--ink); border-color: var(--ink-2); }
section.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px; margin-bottom: 16px;
}
h2 { font-size: 14px; color: var(--ink-2); margin: 0 0 10px; }
table.lb { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
table.lb th, table.lb td {
  text-align: right; padding: 5px 10px; border-bottom: 1px solid var(--grid);
  white-space: nowrap;
}
table.lb th {
  color: var(--muted); font-size: 12px; cursor: pointer; user-select: none;
  position: sticky; top: 0; background: var(--surface);
}
table.lb th:first-child, table.lb td:first-child { text-align: left; }
table.lb tr.row { cursor: pointer; }
table.lb tr.row:hover td { background: rgba(137,135,129,0.08); }
table.lb tr.bench td { border-bottom: 1px solid var(--axis); }
table.lb tr.off td { color: var(--muted); }
.chip {
  display: inline-block; width: 10px; height: 10px; border-radius: 3px;
  margin-right: 7px; vertical-align: baseline;
}
.pin { color: var(--muted); font-size: 11px; margin-left: 6px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
  margin-bottom: 10px; }
.controls label { color: var(--ink-2); cursor: pointer; }
.controls .sep { flex: 1; }
.controls button, .controls select {
  font: inherit; padding: 3px 10px; border: 1px solid var(--border);
  border-radius: 6px; background: var(--surface); color: var(--ink); cursor: pointer;
}
.controls button.on { border-color: var(--ink-2); font-weight: 600; }
#tooltip {
  position: fixed; pointer-events: none; display: none; z-index: 10;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 7px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.18);
  font-variant-numeric: tabular-nums;
}
#tooltip .t { color: var(--muted); margin-bottom: 3px; }
#tooltip .r { display: flex; gap: 8px; justify-content: space-between; }
.chart-box { overflow-x: auto; }
.strip-box { overflow-x: auto; margin-top: 10px; }
table.strip { border-collapse: collapse; font-size: 11px; }
table.strip td, table.strip th { padding: 0; }
table.strip th {
  text-align: right; padding-right: 8px; color: var(--ink-2); font-weight: 400;
  white-space: nowrap;
}
table.strip td.cell {
  width: 22px; height: 16px; border: 1px solid var(--surface); cursor: pointer;
}
table.strip td.cell.nul { background: transparent; border: 1px dashed var(--grid); }
table.strip td.cell.sel { outline: 2px solid var(--ink); outline-offset: -1px; }
table.strip td.daylab {
  writing-mode: vertical-rl; transform: rotate(180deg); color: var(--muted);
  font-size: 10px; padding: 2px 0; cursor: pointer; text-align: right;
}
.note { color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>

  <header>

</div>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("payload").textContent);
const SLOTS = 8;
const SEQ = ["#cde2fb","#b7d3f6","#9ec5f4","#86b6ef","#6da7ec","#5598e7",
             "#3987e5","#2a78d6","#256abf","#1c5cab","#184f95","#104281","#0d366b"];
const fmt = (v, nd) => v == null ? "—" : v.toLocaleString("en-IN",
  { minimumFractionDigits: nd, maximumFractionDigits: nd });

document.getElementById("title").textContent =
  (DATA.kind === "eval" ? "Evaluation" : "Validation") +
  " leaderboard — Erandol & Gursarai";
document.getElementById("basis").textContent = "Basis: " + DATA.basis_label;
document.getElementById("genat").textContent = "generated " + DATA.generated_at;

const plants = Object.keys(DATA.plants);
const state = {};
for (const p of plants) {
  const d = DATA.plants[p];
  d.series.forEach((s, i) => {
    // Fixed slot order: benchmarks own slots 0-1, candidates start at 2, so a
    // series keeps its color no matter which page or filter it appears on.
    s.slot = s.pinned ? (s.label === "qca" ? 0 : 1) : 2 + (i - firstCand(d)) % (SLOTS - 2);
    s.dash = (!s.pinned && (i - firstCand(d)) >= SLOTS - 2) ? "6 4" : null;
  });
  state[p] = {
    day: null, errorView: false,
    visible: new Set(d.series.slice(0, 3).map(s => s.label)),
    sortKey: "dsm_impact_pct", sortDir: 1,
  };
}
function firstCand(d) { return d.series.findIndex(s => !s.pinned); }
let activePlant = plants[0];

const tabs = document.getElementById("tabs");
for (const p of plants) {
  const b = document.createElement("button");
  b.textContent = p[0].toUpperCase() + p.slice(1) +
    " (" + DATA.plants[p].capacity_mw + " MW)";
  b.onclick = () => { activePlant = p; renderAll(); };
  b.dataset.plant = p;
  tabs.appendChild(b);
}

function color(s) { return "var(--s" + s.slot + ")"; }

function renderAll() {
  for (const b of tabs.children) b.classList.toggle("on", b.dataset.plant === activePlant);
  const root = document.getElementById("plant-root");
  root.innerHTML = "";
  root.appendChild(renderPlant(activePlant));
}

function renderPlant(p) {
  const d = DATA.plants[p], st = state[p];
  const frag = document.createElement("div");

  const tblCard = document.createElement("section");
  tblCard.className = "card";
  tblCard.innerHTML = "<h2>Leaderboard — " + p + " · " + DATA.basis_label +
    "</h2>";
  tblCard.appendChild(renderTable(p));
  tblCard.appendChild(renderClipNote(p));
  frag.appendChild(tblCard);

  const chCard = document.createElement("section");
  chCard.className = "card";
  chCard.innerHTML = "<h2>Series — " + p +
    " (actual always on; toggle the rest)</h2>";
  chCard.appendChild(renderControls(p));
  const box = document.createElement("div");
  box.className = "chart-box";
  box.id = "chart-" + p;
  chCard.appendChild(box);
  const strip = document.createElement("div");
  strip.className = "strip-box";
  strip.appendChild(renderStrip(p));
  chCard.appendChild(strip);
  const note = document.createElement("div");
  note.className = "note";
  note.textContent = "Per-day strip: DSM penalty ₹ per day (" + DATA.basis_label +
    "). Click a cell or day label to zoom that day; darker = costlier.";
  chCard.appendChild(note);
  frag.appendChild(chCard);

  requestAnimationFrame(() => drawChart(p));
  return frag;
}

const COLS = [
  ["free_band_pct", "Free-band %"], ["rmse_mw", "RMSE MW"],
  ["dsm_impact_pct", "DSM impact %"], ["dsm_penalty_rs", "DSM penalty ₹"],
];
// Every series in this page is capped to [0, capacity] at read time (never
// in S3) — this column is how that clip stays visible instead of buried.
function renderClipNote(p) {
  const d = DATA.plants[p];
  const nc = d.n_clipped || {};
  const total = d.timestamps.length;
  const parts = ["actual", "qca", "sunsure"]
    .filter(k => nc[k] != null)
    .map(k => k + ": " + nc[k] + "/" + total);
  const note = document.createElement("div");
  note.className = "note";
  note.textContent = "Capacity clip [0, " + d.capacity_mw +
    " MW] applied at read time (blocks clipped of " + total +
    " in the loaded window): " + (parts.length ? parts.join(", ") : "none") +
    ". Per-candidate prediction clip counts are in the \"clipped\" column below.";
  return note;
}
function renderTable(p) {
  const d = DATA.plants[p], st = state[p];
  const t = document.createElement("table");
  t.className = "lb";
  const hd = document.createElement("tr");
  const cols = [["label", "label"]].concat(COLS,
    [["clipped", "clipped"], ["coverage", "coverage"], ["evaluated_at", "evaluated at"]]);
  for (const [key, name] of cols) {
    const th = document.createElement("th");
    th.textContent = name + (st.sortKey === key ? (st.sortDir > 0 ? " ▲" : " ▼") : "");
    th.onclick = () => {
      st.sortDir = st.sortKey === key ? -st.sortDir : 1;
      st.sortKey = key;
      renderAll();
    };
    hd.appendChild(th);
  }
  t.appendChild(hd);

  const val = (s, k) => {
    if (k === "label") return s.label;
    if (k === "coverage") return s.coverage_scored;
    if (k === "evaluated_at") return s.evaluated_at;
    if (k === "clipped") return s.n_clipped;
    return s.metrics ? s.metrics[k] : null;
  };
  const bench = d.series.filter(s => s.pinned);
  const cand = d.series.filter(s => !s.pinned).slice().sort((a, b) => {
    const x = val(a, st.sortKey), y = val(b, st.sortKey);
    if (x == null) return 1;
    if (y == null) return -1;
    return (x < y ? -1 : x > y ? 1 : 0) * st.sortDir;
  });
  for (const s of bench.concat(cand)) {
    const tr = document.createElement("tr");
    tr.className = "row" + (s.pinned ? " bench" : "") +
      (state[p].visible.has(s.label) ? "" : " off");
    const cells = [
      '<td><span class="chip" style="background:' + color(s) + '"></span>' +
        esc(s.label) + (s.pinned ? '<span class="pin">benchmark</span>' : "") + "</td>",
      "<td>" + fmt(s.metrics && s.metrics.free_band_pct, 2) + "</td>",
      "<td>" + fmt(s.metrics && s.metrics.rmse_mw, 3) + "</td>",
      "<td>" + fmt(s.metrics && s.metrics.dsm_impact_pct, 3) + "</td>",
      "<td>" + fmt(s.metrics && s.metrics.dsm_penalty_rs, 0) + "</td>",
      "<td>" + (s.n_clipped == null ? "—" : s.n_clipped) + "</td>",
      "<td>" + s.coverage_scored + "/" + s.coverage_total + "</td>",
      "<td>" + esc(s.evaluated_at) + "</td>",
    ];
    tr.innerHTML = cells.join("");
    tr.onclick = () => { toggle(p, s.label); };
    t.appendChild(tr);
  }
  return t;
}
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function toggle(p, label) {
  const v = state[p].visible;
  if (v.has(label)) v.delete(label); else v.add(label);
  renderAll();
}

function renderControls(p) {
  const d = DATA.plants[p], st = state[p];
  const bar = document.createElement("div");
  bar.className = "controls";
  for (const s of d.series) {
    const lab = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = st.visible.has(s.label);
    cb.onchange = () => toggle(p, s.label);
    lab.appendChild(cb);
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.style.background = color(s);
    lab.appendChild(chip);
    lab.appendChild(document.createTextNode(s.label));
    bar.appendChild(lab);
  }
  const sep = document.createElement("span");
  sep.className = "sep";
  bar.appendChild(sep);

  const err = document.createElement("button");
  err.textContent = "error view";
  err.className = st.errorView ? "on" : "";
  err.onclick = () => { st.errorView = !st.errorView; renderAll(); };
  bar.appendChild(err);

  const sel = document.createElement("select");
  const optAll = document.createElement("option");
  optAll.value = ""; optAll.textContent = "full range";
  sel.appendChild(optAll);
  for (const day of d.days) {
    const o = document.createElement("option");
    o.value = day; o.textContent = day;
    sel.appendChild(o);
  }
  sel.value = st.day || "";
  sel.onchange = () => { st.day = sel.value || null; renderAll(); };
  bar.appendChild(sel);

  const prev = document.createElement("button");
  prev.textContent = "◀ day";
  prev.onclick = () => stepDay(p, -1);
  const next = document.createElement("button");
  next.textContent = "day ▶";
  next.onclick = () => stepDay(p, 1);
  bar.appendChild(prev);
  bar.appendChild(next);
  return bar;
}
function stepDay(p, dir) {
  const d = DATA.plants[p], st = state[p];
  const i = st.day ? d.days.indexOf(st.day) : (dir > 0 ? -1 : d.days.length);
  const j = Math.min(d.days.length - 1, Math.max(0, i + dir));
  st.day = d.days[j];
  renderAll();
}

function domainIdx(p) {
  const d = DATA.plants[p], st = state[p];
  if (!st.day) return [0, d.timestamps.length - 1];
  let lo = -1, hi = -1;
  d.timestamps.forEach((t, i) => {
    if (t.slice(0, 10) === st.day) { if (lo < 0) lo = i; hi = i; }
  });
  return lo < 0 ? [0, d.timestamps.length - 1] : [lo, hi];
}

function visSeries(p) {
  return DATA.plants[p].series.filter(s => state[p].visible.has(s.label));
}

function drawChart(p) {
  const box = document.getElementById("chart-" + p);
  if (!box) return;
  const d = DATA.plants[p], st = state[p];
  const W = Math.max(640, box.clientWidth - 2), H = 380;
  const M = { l: 52, r: 14, t: 12, b: 26 };
  const [i0, i1] = domainIdx(p);
  const n = i1 - i0 + 1;
  const xs = i => M.l + (W - M.l - M.r) * (n === 1 ? 0.5 : (i - i0) / (i1 - i0));

  const vis = visSeries(p);
  let yMin, yMax;
  if (st.errorView) {
    let m = d.band_mw * 1.4;
    for (const s of vis) for (let i = i0; i <= i1; i++) {
      const v = s.values[i], a = d.actual[i];
      if (v != null && a != null) m = Math.max(m, Math.abs(v - a));
    }
    yMax = m * 1.06; yMin = -yMax;
  } else {
    yMin = 0; yMax = d.capacity_mw;
    for (const s of vis) for (let i = i0; i <= i1; i++)
      if (s.values[i] != null) yMax = Math.max(yMax, s.values[i]);
    for (let i = i0; i <= i1; i++)
      if (d.actual[i] != null) yMax = Math.max(yMax, d.actual[i]);
    yMax *= 1.05;
  }
  const ys = v => M.t + (H - M.t - M.b) * (1 - (v - yMin) / (yMax - yMin));

  const el = [];
  el.push('<rect x="0" y="0" width="' + W + '" height="' + H +
    '" fill="var(--surface)"/>');
  if (st.errorView) {
    el.push('<rect x="' + M.l + '" y="' + ys(d.band_mw) + '" width="' +
      (W - M.l - M.r) + '" height="' + (ys(-d.band_mw) - ys(d.band_mw)) +
      '" fill="var(--band-fill)"/>');
    el.push(txt(M.l + 6, ys(d.band_mw) + 12,
      "free band ±" + d.band_mw + " MW (±" + d.free_band_pct + "% of capacity)"));
  }
  const ticks = 5;
  for (let k = 0; k <= ticks; k++) {
    const v = yMin + (yMax - yMin) * k / ticks;
    el.push('<line x1="' + M.l + '" x2="' + (W - M.r) + '" y1="' + ys(v) +
      '" y2="' + ys(v) + '" stroke="var(--grid)" stroke-width="1"/>');
    el.push(txt(M.l - 6, ys(v) + 4, fmt(v, 1), "end"));
  }
  if (st.errorView)
    el.push('<line x1="' + M.l + '" x2="' + (W - M.r) + '" y1="' + ys(0) +
      '" y2="' + ys(0) + '" stroke="var(--axis)" stroke-width="1.4"/>');

  const step = Math.max(1, Math.floor(n / (st.day ? 12 : 8)));
  for (let i = i0; i <= i1; i += step) {
    const t = d.timestamps[i];
    const lab = st.day ? t.slice(11) : t.slice(5, 10);
    el.push(txt(xs(i), H - 8, lab, "middle"));
  }

  const path = vals => {
    let out = "", pen = false;
    for (let i = i0; i <= i1; i++) {
      const v = vals[i];
      if (v == null) { pen = false; continue; }
      out += (pen ? "L" : "M") + xs(i).toFixed(1) + " " + ys(v).toFixed(1);
      pen = true;
    }
    return out;
  };
  if (!st.errorView && d.actual)
    el.push('<path d="' + path(d.actual) +
      '" fill="none" stroke="var(--ink)" stroke-width="2.4"/>');
  for (const s of vis) {
    const vals = st.errorView
      ? s.values.map((v, i) => v == null || d.actual[i] == null ? null : v - d.actual[i])
      : s.values;
    el.push('<path d="' + path(vals) + '" fill="none" stroke="' + color(s) +
      '" stroke-width="1.7"' +
      (s.dash ? ' stroke-dasharray="' + s.dash + '"' : "") + "/>");
  }
  el.push('<line id="xh-' + p + '" y1="' + M.t + '" y2="' + (H - M.b) +
    '" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>');
  el.push('<rect id="ov-' + p + '" x="' + M.l + '" y="' + M.t + '" width="' +
    (W - M.l - M.r) + '" height="' + (H - M.t - M.b) + '" fill="transparent"/>');

  box.innerHTML = '<svg width="' + W + '" height="' + H +
    '" role="img" aria-label="' + p + ' series chart">' + el.join("") + "</svg>";

  const ov = document.getElementById("ov-" + p);
  const xh = document.getElementById("xh-" + p);
  const tip = document.getElementById("tooltip");
  ov.addEventListener("mousemove", ev => {
    const r = ov.getBoundingClientRect();
    const fx = (ev.clientX - r.left) / r.width;
    const i = Math.round(i0 + fx * (i1 - i0));
    const x = xs(i);
    xh.setAttribute("x1", x); xh.setAttribute("x2", x);
    xh.setAttribute("visibility", "visible");
    let rows = '<div class="t">' + d.timestamps[i].replace("T", " ") + "</div>";
    const line = (name, v, col) => '<div class="r"><span>' +
      '<span class="chip" style="background:' + col + '"></span>' + esc(name) +
      "</span><b>" + fmt(v, 2) + "</b></div>";
    if (!st.errorView) rows += line("actual", d.actual[i], "var(--ink)");
    for (const s of vis) {
      const v = st.errorView
        ? (s.values[i] == null || d.actual[i] == null ? null : s.values[i] - d.actual[i])
        : s.values[i];
      rows += line(s.label, v, color(s));
    }
    tip.innerHTML = rows;
    tip.style.display = "block";
    const tw = tip.offsetWidth;
    tip.style.left = Math.min(window.innerWidth - tw - 12, ev.clientX + 14) + "px";
    tip.style.top = (ev.clientY + 14) + "px";
  });
  ov.addEventListener("mouseleave", () => {
    xh.setAttribute("visibility", "hidden");
    tip.style.display = "none";
  });
}
function txt(x, y, s, anchor) {
  return '<text x="' + x + '" y="' + y + '" fill="var(--muted)" font-size="11"' +
    (anchor ? ' text-anchor="' + anchor + '"' : "") + ">" + esc(s) + "</text>";
}

function renderStrip(p) {
  const d = DATA.plants[p], st = state[p];
  const withDays = d.series.filter(s => s.day_penalty);
  const t = document.createElement("table");
  t.className = "strip";
  let maxPen = 0;
  for (const s of withDays) for (const v of s.day_penalty)
    if (v != null) maxPen = Math.max(maxPen, v);
  const labRow = document.createElement("tr");
  labRow.appendChild(document.createElement("th"));
  for (const day of d.days) {
    const td = document.createElement("td");
    td.className = "daylab";
    td.textContent = day.slice(5);
    td.onclick = () => { st.day = st.day === day ? null : day; renderAll(); };
    labRow.appendChild(td);
  }
  t.appendChild(labRow);
  for (const s of withDays) {
    const tr = document.createElement("tr");
    const th = document.createElement("th");
    th.innerHTML = '<span class="chip" style="background:' + color(s) +
      '"></span>' + esc(s.label);
    tr.appendChild(th);
    s.day_penalty.forEach((v, di) => {
      const td = document.createElement("td");
      const day = d.days[di];
      td.className = "cell" + (v == null ? " nul" : "") +
        (st.day === day ? " sel" : "");
      if (v != null) {
        const k = maxPen > 0 ? Math.round((SEQ.length - 1) * v / maxPen) : 0;
        td.style.background = SEQ[k];
        td.title = s.label + " · " + day + " · ₹" + fmt(v, 0);
      } else {
        td.title = s.label + " · " + day + " · no data";
      }
      td.onclick = () => { st.day = st.day === day ? null : day; renderAll(); };
      tr.appendChild(td);
    });
    t.appendChild(tr);
  }
  return t;
}

window.addEventListener("resize", () => drawChart(activePlant));
renderAll();
</script>
</body>
